
<button
  type="button"
  class="intersection"

  [class.pierre-noire]="couleur() === 'noir'"
  [class.pierre-blanche]="couleur() === 'blanc'"

  [attr.aria-label]="'Ligne ' + (ligne() + 1) + ', colonne ' + (colonne() + 1)"

  (click)="couleur() === null && jouer.emit({
    ligne: ligne(),
    colonne: colonne()
  })"

  (contextmenu)="$event.preventDefault(); retirer.emit({
    ligne: ligne(),
    colonne: colonne()
  })"
>
  <span
    class="pierre"
    [class.visible]="couleur() !== null"
    [class.noire]="couleur() === 'noir'"
    [class.blanche]="couleur() === 'blanc'"
  ></span>
</button>
